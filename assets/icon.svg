       unmodified and complete, animal and wordmark together: Homey asks that an
       app supporting a specific brand use that company's brand icon.
       The transform crops to the artwork bounds and scales it onto Homey's
       960x960 canvas, which the source (480x316, with wide margins) does not
       fill. The source's full-canvas background rect is dropped, since Homey
       icons must be transparent. Drawn in white because Homey renders the icon
       against the app's brandColor. fill-rule is evenodd, which the wordmark's
       counters and the figure's interior detail both depend on. -->
