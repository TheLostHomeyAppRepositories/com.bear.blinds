    <rect x="110" y="270" width="740" height="100" rx="40"/>
    <rect x="110" y="420" width="740" height="100" rx="40"/>
    <rect x="110" y="570" width="740" height="100" rx="40"/>
    <rect x="110" y="720" width="740" height="100" rx="40"/>
    <rect x="370" y="865" width="220" height="60" rx="30"/>
  </g>
</svg>
